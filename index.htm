<!doctype html>
<html lang="en-US">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Coding Template- Shoppinglist</title>
  <link rel="stylesheet" type="text/css" href="css/MyCss.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet"> 
</head>


<body>
  <h1>Manipulate the DOM</h1>
  <h2>Shoppinglist</h2>
  <div class="container-fluid">
    <ul id="list">
    </ul>
  </div>
  <div class="container-fluid">
    <h2>Shoppinglist UNHEALTHY</h2>
    
    <ul id="listUnhealthy">
    </ul>
  </div>
  
  <div class="col-2 m-2">

      <div class="form-group mb-1">
        <label for="groceryName">Add Item:</label>
        <input type="text" class="form-control" id="groceryName" placeholder="Enter grocery">
      </div>
      <button class="btn btn-primary"  id="addButton">Add item</button>

  </div>

  <script src="js/index.js"></script>
</body>
</html>
